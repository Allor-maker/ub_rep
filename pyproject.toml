# Tool settings only (the harness is not an installable package).
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tools", "tests"]
# Task fixtures are data (copies of task workspaces), not our code.
extend-exclude = ["tests/e2e/tasks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
