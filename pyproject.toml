# Development-tool settings only. This is NOT an installable package manifest.
# Runtime/dev dependencies, exact versions and build backend are pending A1.
# Do not run `pip install .` or assume pytest/ruff are already installed.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
