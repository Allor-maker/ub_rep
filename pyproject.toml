# Development-tool settings only. This is NOT an installable package manifest.
# Optional checks: requirements-dev.txt; SDK probe: requirements-sdk-probe.txt.
# Final runtime lock and build backend are pending A6; `pip install .` is unsupported.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
