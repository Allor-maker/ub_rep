name: A1-A5 and B-minimal Linux CI

"on":
  push:
    branches: [feature/a1-contracts, feature/a2-budget-ledger, feature/a3-llm-gateway, feature/a4-planner, feature/a5-orchestration, feature/b-minimal]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a1-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONPATH: src
  MYPYPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  contracts:
    name: A1-A5 and B-minimal tests, real SDK, Ruff and Mypy (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-llm.txt
            requirements-sdk-probe.txt
      - name: Install A1-A5 checks and SDK (Linux dependency resolution)
        run: python -m pip install --timeout 30 --retries 2 -r requirements-dev.txt -r requirements-llm.txt -r requirements-sdk-probe.txt
      - name: All A1-A5 and B-minimal tests (no live API)
        timeout-minutes: 5
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m unittest discover -s tests -v
      - name: Ruff lint
        run: python -m ruff check src tests run_agent.py
      - name: Ruff formatting
        run: python -m ruff format --check src tests run_agent.py
      - name: Mypy A1-A5 and Protocol consumers
        run: >-
          python -m mypy src/nsu_budget_agent/contracts src/nsu_budget_agent/budget
          src/nsu_budget_agent/llm src/nsu_budget_agent/telemetry
          src/nsu_budget_agent/task_io src/nsu_budget_agent/planning
          src/nsu_budget_agent/tools src/nsu_budget_agent/solvers src/nsu_budget_agent/validation
          src/nsu_budget_agent/orchestration/engine.py
          src/nsu_budget_agent/orchestration/runtime.py
          src/nsu_budget_agent/orchestration/cli.py src/nsu_budget_agent/submission run_agent.py
          tests/contracts/typecheck_consumers.py tests/contracts/typecheck_budget.py
          tests/contracts/typecheck_llm.py tests/contracts/typecheck_planning.py
          tests/contracts/typecheck_orchestration.py
          tests/contracts/typecheck_b_minimal.py

  sdk:
    name: openJiuwen 0.1.19 Linux probe (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sdk-probe.txt
      - name: Install SDK and resolve Linux dependencies
        timeout-minutes: 10
        # Resolve for Linux; the Windows snapshot is deliberately not used.
        run: python -m pip install --timeout 30 --retries 2 -r requirements-sdk-probe.txt
      - name: Check installed SDK dependencies
        run: python -m pip check
      - name: SDK workflow, cancellation and deadline probe (no LLM calls)
        timeout-minutes: 3
        # The probe guards selected socket events, not all network operations.
        # No API keys or secrets are provided to either job.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m nsu_budget_agent.orchestration.sdk_probe
